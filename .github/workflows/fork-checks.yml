#
# Quick checks for the fork that need no Mac: they run on every pull request and on main.
name: Fork checks

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: fork-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # An update must install over the BCD already on the device and spend no new App ID of a
      # free Apple ID's ten a week: the app's three identifiers and its extension count are fixed.
      - name: Check the app's identifiers are unchanged
        run: python3 tests/host/check-fork-bundle-ids.py

      - name: Check every app source is in the Xcode project
        run: python3 tests/host/check-xcode-sources.py

      - name: Check the foldable iPhone support (static part)
        run: python3 tests/host/check-bcd-foldable.py
